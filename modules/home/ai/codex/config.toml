model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
network_access = true
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = 'cached'
# Keep direnv-provided environment from the parent shell by avoiding login shell startup.
allow_login_shell = false

[features]
shell_snapshot = false
remote_connections = true

[sandbox_workspace_write]
network_access = true
writable_roots = [ "/dev/pts", "/dev/ptmx", "~/.gnupg", ".git" ]

[tui]
notifications = ["agent-turn-complete","approval-requested"]

[shell_environment_policy]
inherit = "all"
experimental_use_profile = true

[analytics]
enabled = false

[otel]
environment = "dev"
log_user_prompt = false
exporter = { "otlp-http" = { endpoint = "http://Cipher:4318/v1/logs", protocol = "binary" } }
metrics_exporter = { "otlp-http" = { endpoint = "http://Cipher:4318/v1/metrics", protocol = "binary" } }
trace_exporter = { "otlp-http" = { endpoint = "http://Cipher:4318/v1/traces", protocol = "binary" } }

[mcp_servers.context7]
command = "bunx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.devtools]
command = "bunx"
args = ["-y", "chrome-devtools-mcp@latest"]

[profiles.full-access]
sandbox_mode = "danger-full-access"
ask_for_approval = "never"
